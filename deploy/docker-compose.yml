# Sysible Connect — the fleet terminal workspace.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   open https://localhost:8700
#
# On first start an admin account is seeded. Set SYSIBLE_CONNECT_PASSWORD below to
# choose it; otherwise a random one is generated and printed once to the logs
# (docker compose -f deploy/docker-compose.yml logs | grep 'first-run admin').
# You'll be asked to change a generated password on first login.
#
# The console is served over HTTPS with a self-signed cert by default (so the
# browser terminal is a secure context and traffic is encrypted). Your browser
# shows a one-time trust warning — expected; proceed once. Set
# SYSIBLE_CONNECT_TLS_HOSTS to your server's IP/hostname to put it in the cert
# and remove the name-mismatch warning. For a warning-free cert, set
# SYSIBLE_CONNECT_TLS=0 and terminate TLS at a reverse proxy with a real cert.
#
# One service, one volume. Login, host inventory, the encrypted Controller link
# and the per-install secret key persist in the named `connect-data` volume.
services:
  connect:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # URL prefix the console is served under. "/" standalone; the SLOP
        # installer sets "/connect/" so the SPA's assets + API base + terminal
        # websocket live under the gateway's /connect/* path on the one origin.
        SYSIBLE_BASE_PATH: "${SYSIBLE_BASE_PATH:-/}"
    image: sysible-connect:latest
    container_name: sysible-connect
    ports:
      # Standalone Connect: the web console (API + SPA) over HTTPS on the LAN.
      # SSO NOTE: behind the SLOP gateway, Connect must be reachable ONLY through the
      # gateway (that is the trust boundary — see the SSO trust comment in backend/app.py).
      # Do NOT publish 8700 on 0.0.0.0 in that deployment: bind it to loopback / the
      # gateway network (e.g. `127.0.0.1:8700:8700`, or drop this block and put Connect
      # on the gateway's internal compose network) so a LAN client can't hit :8700
      # directly and bypass Caddy. The SLOP installer wires this up.
      - "8700:8700"
    volumes:
      - connect-data:/data
    environment:
      SYSIBLE_CONNECT_DATA: /data
      SYSIBLE_CONNECT_TLS: "1"                          # "0" to serve plain HTTP (behind a proxy)
      SYSIBLE_CONNECT_TLS_HOSTS: ${SYSIBLE_CONNECT_TLS_HOSTS:-}  # e.g. 192.168.8.249,connect.lan
      # SYSIBLE_CONNECT_PASSWORD: change-me            # uncomment to set the admin password
      # Single sign-on behind the SLOP gateway. Both default OFF/empty, so a
      # standalone Connect keeps its own login. The SLOP installer sets these so
      # Connect trusts the gateway-asserted identity ONLY when the request carries
      # the matching shared secret (see SLOP docs/SSO.md).
      SYSIBLE_CONNECT_TRUST_GATEWAY_AUTH: "${SYSIBLE_CONNECT_TRUST_GATEWAY_AUTH:-0}"
      SYSIBLE_SSO_SHARED_SECRET: "${SYSIBLE_SSO_SHARED_SECRET:-}"
    restart: unless-stopped

volumes:
  connect-data:
